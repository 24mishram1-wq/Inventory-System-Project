<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StockPilot · Inventory Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">▣</span> StockPilot <small>Inventory Management</small></div>
  </header>

  <main>
    <section class="stats">
      <div class="card"><span>Products</span><b id="sProducts">0</b></div>
      <div class="card"><span>Total units</span><b id="sUnits">0</b></div>
      <div class="card"><span>Inventory value</span><b id="sValue">₹0</b></div>
      <div class="card warn"><span>Low stock</span><b id="sLow">0</b></div>
    </section>

    <div id="alertBar" class="alert" hidden></div>

    <div class="layout">
      <section class="panel form-panel">
        <h2>Add product</h2>
        <form id="addForm" novalidate>
          <label>Product name<input name="name" placeholder="e.g. Wireless Mouse" required></label>
          <label>Category<input name="category" list="catList" placeholder="e.g. Electronics" required></label>
          <datalist id="catList"></datalist>
          <div class="row">
            <label>Quantity<input name="quantity" type="number" min="0" step="1" value="0" required></label>
            <label>Price (₹)<input name="price" type="number" min="0" step="0.01" value="0" required></label>
          </div>
          <button class="btn primary" type="submit">+ Add product</button>
        </form>
      </section>

      <section class="panel list-panel">
        <div class="toolbar">
          <input id="search" type="search" placeholder="Search by name, ID or category…">
          <select id="filter"><option value="">All categories</option></select>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Product</th><th>Category</th><th>Stock</th><th>Price</th><th>Status</th><th></th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <p id="empty" class="empty" hidden>No products found.</p>
      </section>
    </div>
  </main>

  <dialog id="editDlg">
    <form id="editForm" method="dialog" novalidate>
      <h2>Edit product <span id="editId"></span></h2>
      <label>Name<input name="name" required></label>
      <label>Category<input name="category" required></label>
      <div class="row">
        <label>Quantity<input name="quantity" type="number" min="0" step="1" required></label>
        <label>Price (₹)<input name="price" type="number" min="0" step="0.01" required></label>
      </div>
      <div class="actions">
        <button type="button" class="btn" id="cancelEdit">Cancel</button>
        <button type="submit" class="btn primary">Save changes</button>
      </div>
    </form>
  </dialog>

  <div id="toast"></div>
  <script src="script.js"></script>
</body>
</html>
